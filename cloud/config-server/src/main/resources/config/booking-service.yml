server:
  port: 5009

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/booking_service
    username: we
    password: we

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: booking-service-group

  # booking api-> payment link-> make payment->payment id-> verify payment-> update booking status
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    #si registra con ip adress non con hostname
    prefer-ip-address: true

