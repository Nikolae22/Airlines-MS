server:
  port: 5007

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/airline_seat
    username: we
    password: we


  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: seat-service-group
      key-deserializer: org.apache.kafka.common.serialization.SpringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    #si registra con ip adress non con hostname
    prefer-ip-address: true


