server:
  port: 5002
spring:
  application:
    name: airlane-core-service
  datasource:
    url: jdbc:h2:mem:airline_location
    username: we
    password: we
    driver-class-name: org.h2.Driver
    h2:
      console:
        enabled: true
        path: /h2-console
    jpa:
      hibernate:
        ddl-auto: update

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    #si registra con ip adress non con hostname
    prefer-ip-address: true

  #  datasource:
  #    url: jdbc:mysql://localhost:3306/airline_location_db
  #    username: we
  #    password: we