server:
  port: 5009

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:h2:mem:booking_service
    username: we
    password: we
    driver-class-name: org.h2.Driver
    h2:
      console:
        enabled: true
        path: /h2-console
    jpa:
      hibernate:
        ddl-auto: update

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: booking-service-group

  # booking api-> payment link-> make payment->payment id-> verify payment-> update booking status
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    #si registra con ip adress non con hostname
    prefer-ip-address: true

