server:
  port: 5012

spring:
  application:
    name: notification-service

  mail:
    host: smtp.gmai.com
    port: 587
    username: ${MAIL_USERNAME:morarunicolae96@gmail.com}
    #qua sottoserve app password
    # che si crea in gmail
    password: ${MAIL_PASSWORD:we}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false


  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
      fetch-registry: true
      register-with-eureka: true
    instance:
      prefer-ip-address: true
      instance-id: ${spring.application.name}:${spring.applciation.instance_id:${random.value}}

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serailizer.JacksonJsonDeserializer
      properities:
        spring.json.trusted.packages: com.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.event.BookingConfirmedEvent

notification:
  from-email: ${MAIL_FROM:we@we.com}
  from-name: "We notificatoin"
  checking-url: "your frontend url"


