
server:
  port: 5010

spring:
  application:
    name: payment-service


  datasource:
    url: jdbc:h2:mem:payment-service
    username: we
    password: we
    driver-class-name: org.h2.Driver
    h2:
      console:
        enabled: true
        path: /h2-console
    jpa:
      hibernate:
        ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    #si registra con ip adress non con hostname
    prefer-ip-address: true

  #  datasource:
  #    url: jdbc:mysql://localhost:3306/payment-service
  #    username: we
  #    password: we

razorpay:
  api:
    key: needtocreate
    secret: needtocreate
  callback:
    base-url: https://creailtuofrontenddude.app