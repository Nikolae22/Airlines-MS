server:
  port: 5007

spring:
  application:
    name: seat-service

  datasource:
    url: jdbc:h2:mem:airline_seat
    username: we
    password: we
    driver-class-name: org.h2.Driver
    h2:
      console:
        enabled: true
        path: /h2-console
    jpa:
      hibernate:
        ddl-auto: update

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: seat-service-group
      key-deserializer: org.apache.kafka.common.serialization.SpringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    #si registra con ip adress non con hostname
    prefer-ip-address: true
